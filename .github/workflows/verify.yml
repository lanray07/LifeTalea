name: Verify LifeTalea
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - run: android/gradlew -p android --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/test-results/
  website-and-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix website
      - run: npm run build --prefix website
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/localize.py validate
      - run: python scripts/check_website.py
